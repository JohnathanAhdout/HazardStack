version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - spiral-network

  api:
    build:
      context: ../hazardstack
      dockerfile: infra/docker/api.Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://spiral:spiral@db:5432/spiral
      - REDIS_URL=redis://redis:6379
    depends_on:
      - db
      - redis
    restart: unless-stopped
    networks:
      - spiral-network

  db:
    image: postgis/postgis:15-3.3
    environment:
      - POSTGRES_USER=spiral
      - POSTGRES_PASSWORD=spiral
      - POSTGRES_DB=spiral
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - spiral-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - spiral-network

networks:
  spiral-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
